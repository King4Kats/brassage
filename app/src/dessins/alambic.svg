<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <!--
    Retouches Brassage (tout le reste est l'illustration d'origine) :
    - data-haut / data-bas sur #liquid-level (limites du hublot) ;
    - pièces qui n'étaient reliées à rien : le tuyau vers le condenseur part
      désormais de la colonne (x 730 au lieu de 790), la vanne isolée est posée
      sur ce tuyau, le tuyau du bas entre dans le pied de la colonne, le bout
      de tuyau orphelin en haut du condenseur est retiré et celui du bas
      descend jusqu'au sol (évacuation).
  -->
  <title id="title">Alambic moderne — illustration vectorielle animable</title>
  <desc id="desc">Installation stylisée avec cuve en cuivre et acier, colonne de distillation, tuyauterie, condenseur et liquide doré.</desc>
  <defs>
    <linearGradient id="steel" x1="0" x2="1">
      <stop offset="0" stop-color="#263241"/><stop offset=".18" stop-color="#647386"/>
      <stop offset=".34" stop-color="#d3dce4"/><stop offset=".52" stop-color="#697789"/>
      <stop offset=".78" stop-color="#303d4c"/><stop offset="1" stop-color="#182331"/>
    </linearGradient>
    <linearGradient id="steelLight" x1="0" x2="1">
      <stop offset="0" stop-color="#7f8c9b"/><stop offset=".25" stop-color="#e5ebef"/>
      <stop offset=".55" stop-color="#9daab7"/><stop offset="1" stop-color="#536171"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" x2="1">
      <stop offset="0" stop-color="#a84720"/><stop offset=".2" stop-color="#f58b4b"/>
      <stop offset=".42" stop-color="#ffc18a"/><stop offset=".62" stop-color="#d86a32"/>
      <stop offset=".84" stop-color="#9e3d1c"/><stop offset="1" stop-color="#f28a4c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd34f"/><stop offset=".55" stop-color="#ffad16"/><stop offset="1" stop-color="#e87908"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".08"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
    <clipPath id="tankWindowClip"><circle cx="330" cy="430" r="65"/></clipPath>
    <clipPath id="sightClip"><rect x="646" y="204" width="84" height="284" rx="26"/></clipPath>
  </defs>

  <!-- Base line / ground -->
  <path id="ground-line" d="M45 681 H1150" fill="none" stroke="#dbe2e8" stroke-width="3" stroke-linecap="round"/>

  <!-- Rear pipework: animate dashoffset on these paths -->
  <g id="pipes-back" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="pipe-back-left" d="M520 555 H578 Q598 555 598 535 V353 Q598 333 618 333 H665" stroke="#344252" stroke-width="18"/>
    <path d="M520 555 H578 Q598 555 598 535 V353 Q598 333 618 333 H665" stroke="url(#steelLight)" stroke-width="10"/>
    <path id="pipe-back-bottom" d="M470 630 H590 Q610 630 610 610 V590 H670 Q690 590 690 570 V548" stroke="#344252" stroke-width="16"/>
    <path d="M470 630 H590 Q610 630 610 610 V590 H670 Q690 590 690 570 V548" stroke="url(#steelLight)" stroke-width="8"/>
    <path id="pipe-to-condenser" d="M730 482 H840 Q860 482 860 462 V400 Q860 380 880 380 H915" stroke="#344252" stroke-width="17"/>
    <path d="M730 482 H840 Q860 482 860 462 V400 Q860 380 880 380 H915" stroke="url(#steelLight)" stroke-width="9"/>
  </g>

  <!-- Main brew vessel -->
  <g id="main-vessel">
    <g id="vessel-legs" fill="url(#steel)">
      <path d="M177 580 L195 662 H220 L232 580Z"/><path d="M430 580 L443 662 H468 L486 580Z"/>
      <rect x="184" y="659" width="48" height="12" rx="4"/><rect x="437" y="659" width="48" height="12" rx="4"/>
    </g>
    <path id="vessel-body" d="M145 318 Q145 300 165 300 H495 Q515 300 515 320 V574 Q515 603 486 603 H174 Q145 603 145 574Z" fill="url(#steel)" stroke="#253140" stroke-width="4"/>
    <path d="M165 320 V572 M194 313 V586 M462 313 V586 M490 320 V572" stroke="#fff" stroke-opacity=".13" stroke-width="8"/>
    <path id="vessel-rim" d="M140 315 Q140 301 154 301 H506 Q520 301 520 315 V324 H140Z" fill="url(#copper)" stroke="#a94c25" stroke-width="3"/>
    <path d="M154 307 H506" stroke="#ffd0a5" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <!-- Copper dome and neck -->
    <path id="vessel-dome" d="M163 301 Q173 260 218 238 L266 208 V166 H394 V208 L442 238 Q487 260 497 301Z" fill="url(#copper)" stroke="#a94c25" stroke-width="4"/>
    <path d="M185 285 Q203 253 245 235 L276 216 V176 H296 V224 L250 250 Q215 270 207 299Z" fill="#ffd0a5" opacity=".35"/>
    <rect id="vessel-neck" x="278" y="123" width="104" height="91" rx="7" fill="url(#copper)" stroke="#a94c25" stroke-width="4"/>
    <g id="neck-flange">
      <rect x="267" y="202" width="126" height="18" rx="4" fill="url(#steelLight)" stroke="#344252" stroke-width="3"/>
      <circle cx="280" cy="211" r="3" fill="#273342"/><circle cx="380" cy="211" r="3" fill="#273342"/>
    </g>
    <!-- Viewing port -->
    <g id="vessel-window">
      <circle cx="330" cy="430" r="80" fill="url(#steelLight)" stroke="#253140" stroke-width="4"/>
      <circle cx="330" cy="430" r="68" fill="#172431" stroke="#e3e9ee" stroke-width="3"/>
      <g clip-path="url(#tankWindowClip)">
        <!-- data-haut / data-bas : limites du hublot (ajout Brassage, utilisées pour placer le niveau) -->
        <rect id="liquid-level" x="264" y="424" width="132" height="76" fill="url(#gold)" data-haut="365" data-bas="495"/>
        <path id="liquid-surface" d="M264 424 Q276 418 288 424 T312 424 T336 424 T360 424 T384 424 T396 424" fill="none" stroke="#fff0b2" stroke-width="4"/>
        <g id="tank-bubbles" fill="none" stroke="#fff1b8" stroke-width="2.2">
          <circle id="tank-bubble-1" cx="308" cy="454" r="5"/><circle id="tank-bubble-2" cx="347" cy="466" r="7"/><circle id="tank-bubble-3" cx="365" cy="446" r="3"/>
        </g>
      </g>
      <circle cx="330" cy="430" r="80" fill="none" stroke="url(#steelLight)" stroke-width="10"/>
      <g id="window-bolts" fill="#354252" stroke="#c9d2dc" stroke-width="1.5">
        <circle cx="330" cy="357" r="4"/><circle cx="382" cy="378" r="4"/><circle cx="403" cy="430" r="4"/><circle cx="382" cy="482" r="4"/>
        <circle cx="330" cy="503" r="4"/><circle cx="278" cy="482" r="4"/><circle cx="257" cy="430" r="4"/><circle cx="278" cy="378" r="4"/>
      </g>
    </g>
    <!-- Lower service handle -->
    <g id="service-handle">
      <rect x="256" y="528" width="148" height="31" rx="8" fill="#1b2735" stroke="#667585" stroke-width="4"/>
      <path d="M278 542 H382" stroke="url(#steelLight)" stroke-width="10" stroke-linecap="round"/>
      <path d="M283 534 V550 M377 534 V550" stroke="#dbe2e8" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Drain valve -->
    <g id="drain-valve" transform="translate(88 510)">
      <path d="M0 0 H52" stroke="#344252" stroke-width="18" stroke-linecap="round"/>
      <path d="M0 0 H52" stroke="url(#steelLight)" stroke-width="10" stroke-linecap="round"/>
      <rect x="18" y="-17" width="18" height="34" rx="3" fill="url(#steelLight)" stroke="#344252" stroke-width="3"/>
      <path d="M27 -18 V-34" stroke="#344252" stroke-width="7"/>
      <path d="M-4 -37 H43" stroke="#2477d4" stroke-width="8" stroke-linecap="round"/>
      <path d="M20 -37 V-27" stroke="#2477d4" stroke-width="8"/>
    </g>
  </g>

  <!-- Main copper vapor arch -->
  <g id="vapor-pipe">
    <path d="M330 123 V82 Q330 49 363 49 H674 Q708 49 708 82 V143" fill="none" stroke="#9e421f" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="vapor-flow" d="M330 123 V82 Q330 49 363 49 H674 Q708 49 708 82 V143" fill="none" stroke="url(#copper)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M343 116 V82 Q343 62 364 62 H674 Q695 62 695 83 V140" fill="none" stroke="#ffd0a5" stroke-opacity=".8" stroke-width="4" stroke-linecap="round"/>
    <rect x="300" y="111" width="60" height="16" rx="4" fill="url(#steelLight)" stroke="#344252" stroke-width="3"/>
    <rect x="680" y="136" width="58" height="16" rx="4" fill="url(#steelLight)" stroke="#344252" stroke-width="3"/>
  </g>

  <!-- Distillation column -->
  <g id="distillation-column">
    <rect x="650" y="168" width="80" height="350" rx="26" fill="url(#copper)" stroke="#9e421f" stroke-width="4"/>
    <rect x="664" y="198" width="52" height="286" rx="20" fill="url(#gold)" stroke="#f8b74c" stroke-width="2"/>
    <g clip-path="url(#sightClip)" id="column-liquid-details">
      <rect x="646" y="204" width="84" height="284" fill="url(#gold)"/>
      <path d="M665 214 V472" stroke="#fff1b4" stroke-width="5" opacity=".65"/>
      <g id="column-bubbles" fill="none" stroke="#fff4c5" stroke-width="2">
        <circle id="column-bubble-1" cx="682" cy="430" r="4"/><circle id="column-bubble-2" cx="702" cy="390" r="3"/><circle id="column-bubble-3" cx="686" cy="342" r="5"/><circle id="column-bubble-4" cx="704" cy="294" r="3"/>
      </g>
    </g>
    <rect x="638" y="157" width="104" height="17" rx="4" fill="url(#steelLight)" stroke="#344252" stroke-width="3"/>
    <rect x="638" y="510" width="104" height="17" rx="4" fill="url(#steelLight)" stroke="#344252" stroke-width="3"/>
    <rect x="632" y="522" width="116" height="26" rx="5" fill="url(#steel)" stroke="#344252" stroke-width="3"/>
    <g id="column-sight-glass">
      <circle cx="690" cy="246" r="19" fill="url(#steelLight)" stroke="#344252" stroke-width="4"/>
      <circle cx="690" cy="246" r="12" fill="#203142"/><path d="M682 253 L698 237" stroke="#8ba0b4" stroke-width="3"/>
      <circle cx="690" cy="320" r="19" fill="url(#steelLight)" stroke="#344252" stroke-width="4"/>
      <circle cx="690" cy="320" r="12" fill="#203142"/><path d="M682 327 L698 311" stroke="#8ba0b4" stroke-width="3"/>
      <circle cx="690" cy="394" r="19" fill="url(#steelLight)" stroke="#344252" stroke-width="4"/>
      <circle cx="690" cy="394" r="12" fill="#203142"/><path d="M682 401 L698 385" stroke="#8ba0b4" stroke-width="3"/>
    </g>
    <path d="M674 548 V657 M706 548 V657" stroke="url(#steel)" stroke-width="13"/>
    <rect x="656" y="654" width="68" height="14" rx="4" fill="url(#steel)"/>
  </g>

  <!-- Gauges -->
  <g id="gauges">
    <g id="gauge-main" transform="translate(214 263)">
      <path d="M0 29 V45" stroke="#344252" stroke-width="8"/>
      <circle r="29" fill="url(#steelLight)" stroke="#344252" stroke-width="4"/>
      <circle r="22" fill="#f8fafb" stroke="#b6c1cb" stroke-width="2"/>
      <path d="M-13 -12 L-17 -16 M0 -18 V-22 M14 -12 L18 -16" stroke="#c74b36" stroke-width="2"/>
      <path id="gauge-main-needle" d="M0 3 L11 -12" stroke="#263545" stroke-width="3.5" stroke-linecap="round"/>
      <circle r="4" fill="#263545"/>
    </g>
    <g id="gauge-column" transform="translate(605 372)">
      <path d="M0 29 V43" stroke="#344252" stroke-width="7"/>
      <circle r="25" fill="url(#steelLight)" stroke="#344252" stroke-width="4"/>
      <circle r="19" fill="#f8fafb"/>
      <path d="M-11 -10 L-14 -13 M0 -15 V-18 M11 -10 L14 -13" stroke="#c74b36" stroke-width="2"/>
      <path id="gauge-column-needle" d="M0 2 L8 -10" stroke="#263545" stroke-width="3" stroke-linecap="round"/>
      <circle r="3.5" fill="#263545"/>
    </g>
  </g>

  <!-- Control unit -->
  <g id="control-unit">
    <rect x="568" y="542" width="104" height="119" rx="8" fill="url(#steel)" stroke="#263545" stroke-width="4"/>
    <rect x="581" y="555" width="78" height="57" rx="4" fill="#172431" stroke="#9ba8b5" stroke-width="4"/>
    <g id="control-emblem" transform="translate(620 584)" fill="#ffc52e">
      <path d="M0 -16 C-4 -7 -15 -2 -12 8 C-10 17 10 17 12 8 C15 -2 4 -7 0 -16Z"/>
      <path d="M0 -4 C-2 2 -7 4 -5 10 C-3 14 3 14 5 10 C7 4 2 2 0 -4Z" fill="#172431"/>
    </g>
    <g id="status-lights">
      <circle id="light-running" cx="595" cy="632" r="7" fill="#ffc52e" stroke="#ffe7a0" stroke-width="2"/>
      <circle id="light-ready" cx="620" cy="632" r="7" fill="#8ecf8a" stroke="#d4f2cb" stroke-width="2"/>
      <circle id="light-idle" cx="645" cy="632" r="7" fill="#647383" stroke="#b6c1cb" stroke-width="2"/>
    </g>
    <path d="M580 661 V680 M660 661 V680" stroke="url(#steel)" stroke-width="10"/>
  </g>

  <!-- Condenser shell and visible coil -->
  <g id="condenser">
    <path id="condenser-shell" d="M900 302 Q900 280 922 280 H1038 Q1060 280 1060 302 V491 Q1060 514 1038 514 H922 Q900 514 900 491Z" fill="url(#steelLight)" stroke="#344252" stroke-width="4"/>
    <path d="M916 303 Q916 296 925 296 H1037 Q1044 296 1044 305 V486 Q1044 499 1034 499 H926 Q916 499 916 486Z" fill="#182735" stroke="#d8e0e7" stroke-width="3"/>
    <g id="condenser-coil" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path id="coil-shadow" d="M934 322 C1009 322 1009 339 934 339 S1009 356 1009 356 S934 373 934 373 S1009 390 1009 390 S934 407 934 407 S1009 424 1009 424 S934 441 934 441 S1009 458 1009 458 S934 475 934 475" stroke="#a94c25" stroke-width="17"/>
      <path id="coil-copper" d="M934 322 C1009 322 1009 339 934 339 S1009 356 1009 356 S934 373 934 373 S1009 390 1009 390 S934 407 934 407 S1009 424 1009 424 S934 441 934 441 S1009 458 1009 458 S934 475 934 475" stroke="url(#copper)" stroke-width="12"/>
      <path d="M938 318 C1005 318 1005 335 938 335" stroke="#ffd0a5" stroke-width="2.5" opacity=".8"/>
    </g>
    <path d="M980 514 V666" fill="none" stroke="#344252" stroke-width="15" stroke-linecap="round"/>
    <path d="M980 514 V666" fill="none" stroke="url(#steelLight)" stroke-width="8" stroke-linecap="round"/>
    <rect x="966" y="664" width="28" height="9" rx="3" fill="url(#steel)"/>
    <path d="M1060 428 H1084 Q1102 428 1102 447 V475" fill="none" stroke="#344252" stroke-width="13" stroke-linecap="round"/>
    <path d="M1060 428 H1084 Q1102 428 1102 447 V475" fill="none" stroke="url(#steelLight)" stroke-width="7" stroke-linecap="round"/>
    <path d="M954 514 V660 M1006 514 V660" stroke="url(#steel)" stroke-width="12"/>
    <rect x="937" y="657" width="34" height="13" rx="4" fill="url(#steel)"/><rect x="989" y="657" width="34" height="13" rx="4" fill="url(#steel)"/>
  </g>

  <!-- Collection vessel and animated drops -->
  <g id="collection-vessel">
    <path d="M1082 482 H1151 V601 Q1151 616 1136 616 H1097 Q1082 616 1082 601Z" fill="url(#steel)" stroke="#344252" stroke-width="4"/>
    <ellipse cx="1116" cy="482" rx="34" ry="9" fill="url(#steelLight)" stroke="#344252" stroke-width="4"/>
    <ellipse cx="1116" cy="482" rx="23" ry="4" fill="#172431"/>
    <path d="M1096 500 V595 M1136 500 V595" stroke="#fff" stroke-opacity=".18" stroke-width="5"/>
    <path d="M1116 616 V660" stroke="url(#steel)" stroke-width="12"/>
    <rect x="1099" y="657" width="34" height="13" rx="4" fill="url(#steel)"/>
    <g id="product-drops" fill="#ffc21c">
      <path id="drop-1" d="M1099 440 C1099 433 1106 426 1106 419 C1106 426 1113 433 1113 440 A7 7 0 1 1 1099 440Z"/>
      <path id="drop-2" d="M1121 457 C1121 451 1127 445 1127 439 C1127 445 1133 451 1133 457 A6 6 0 1 1 1121 457Z"/>
    </g>
  </g>

  <!-- Foreground connector details -->
  <g id="pipe-fittings" fill="url(#steelLight)" stroke="#344252" stroke-width="3">
    <rect x="512" y="537" width="20" height="36" rx="4"/><rect x="521" y="545" width="14" height="20" rx="3"/>
    <rect x="786" y="468" width="18" height="28" rx="3"/><rect x="792" y="474" width="14" height="16" rx="2"/>
    <circle cx="798" cy="482" r="3" fill="#263545"/>
  </g>
</svg>
